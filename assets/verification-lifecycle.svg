<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">Task verification lifecycle</title>
<desc id="d">A task contract is issued to a worker. The worker returns a claim, which is not a verdict. An independent deterministic verifier inspects observed system state and issues exactly one of three outcomes: verified pass, fail-closed, or escalate. Insufficient evidence routes to fail-closed, never to pass.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/></marker>
<style>
.b{fill:#fff;stroke:#c6d0da;stroke-width:1.5}
.h{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#16212e}
.s{font:12.5px 'Segoe UI',Arial,sans-serif;fill:#5b6b7f}
.l{font:600 11.5px 'Segoe UI',Arial,sans-serif;fill:#5b6b7f;letter-spacing:.07em}
.cap{font:italic 12.5px 'Segoe UI',Arial,sans-serif;fill:#5b6b7f}
.ttl{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#16212e}
.sp{stroke:#5b6b7f;stroke-width:1.8;fill:none}
</style></defs>
<rect width="960" height="540" fill="#f7f9fb"/>
<text x="40" y="42" class="ttl">Task verification lifecycle</text>
<text x="40" y="66" class="cap">The worker reports. The verifier decides. These are never the same actor.</text>

<rect x="40" y="104" width="182" height="92" rx="8" class="b"/>
<text x="60" y="132" class="l">STEP 1</text><text x="60" y="157" class="h">Task contract</text><text x="60" y="179" class="s">Scope and acceptance</text>

<rect x="262" y="104" width="182" height="92" rx="8" fill="#fdf9ef" stroke="#d8c48a" stroke-width="1.5"/>
<text x="282" y="132" class="l">STEP 2</text><text x="282" y="157" class="h">Worker claim</text><text x="282" y="179" class="s">Reported, not proven</text>

<rect x="484" y="104" width="196" height="92" rx="8" fill="#f2f7fc" stroke="#7fa3c9" stroke-width="1.5"/>
<text x="504" y="132" class="l">STEP 3</text><text x="504" y="157" class="h">Independent verifier</text><text x="504" y="179" class="s">Reads observed state</text>

<line x1="222" y1="150" x2="254" y2="150" class="sp" marker-end="url(#a)"/>
<line x1="444" y1="150" x2="476" y2="150" class="sp" marker-end="url(#a)"/>

<text x="353" y="222" class="cap" text-anchor="middle">a claim is not a verdict</text>

<path d="M582 196 L582 250" class="sp"/>
<path d="M582 250 L582 460" class="sp"/>
<path d="M582 288 L716 288" class="sp" marker-end="url(#a)"/>
<path d="M582 374 L716 374" class="sp" marker-end="url(#a)"/>
<path d="M582 460 L716 460" class="sp" marker-end="url(#a)"/>
<text x="596" y="242" class="l">EXACTLY ONE OUTCOME</text>

<rect x="724" y="258" width="196" height="62" rx="8" fill="#f1f8f3" stroke="#2f7d4f" stroke-width="1.5"/>
<text x="744" y="285" class="h" fill="#1f5c39">Verified pass</text><text x="744" y="306" class="s">Evidence supports it</text>

<rect x="724" y="344" width="196" height="62" rx="8" fill="#fdf3f0" stroke="#a4442f" stroke-width="1.5"/>
<text x="744" y="371" class="h" fill="#87351f">Fail-closed</text><text x="744" y="392" class="s">Contradicted or unproven</text>

<rect x="724" y="430" width="196" height="62" rx="8" class="b"/>
<text x="744" y="457" class="h">Escalate</text><text x="744" y="478" class="s">Referred for human review</text>

<rect x="40" y="258" width="440" height="104" rx="8" class="b"/>
<text x="62" y="286" class="l">THE RULE</text>
<text x="62" y="313" class="h">Insufficient evidence is not a pass.</text>
<text x="62" y="337" class="s">An unchecked item fails closed by default.</text>
<text x="62" y="355" class="s">Silence never counts as success.</text>

<text x="40" y="404" class="l">SEPARATION OF DUTIES</text>
<text x="40" y="430" class="s">The actor doing the work and the actor attesting to it are</text>
<text x="40" y="449" class="s">different. No component certifies its own output.</text>
<text x="40" y="486" class="cap">Single-operator system. The verifier itself is not</text>
<text x="40" y="504" class="cap">independently audited.</text>
</svg>
