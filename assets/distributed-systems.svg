<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
<title id="t">Independently validated computation flow</title>
<desc id="d">A job submitter sends a computation job to a compute worker. The worker returns a result, which is a claim. An independent validator panel re-checks the result. Only when the panel agrees is a settlement record written. Disagreement means no settlement.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a4442f"/></marker>
<style>
.b{fill:#fff;stroke:#c6d0da;stroke-width:1.5}
.h{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#16212e}
.s{font:12.5px 'Segoe UI',Arial,sans-serif;fill:#5b6b7f}
.l{font:600 11.5px 'Segoe UI',Arial,sans-serif;fill:#5b6b7f;letter-spacing:.07em}
.ttl{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#16212e}
.cap{font:italic 12.5px 'Segoe UI',Arial,sans-serif;fill:#5b6b7f}
</style></defs>
<rect width="960" height="470" fill="#f7f9fb"/>
<text x="40" y="42" class="ttl">Independently validated computation</text>
<text x="40" y="66" class="cap">A worker's own report of its result does not settle payment. An independent panel decides.</text>

<rect x="40" y="104" width="170" height="76" rx="8" class="b"/>
<text x="125" y="132" class="h" text-anchor="middle">Job submitter</text><text x="125" y="153" class="s" text-anchor="middle">posts a computation</text><text x="125" y="170" class="s" text-anchor="middle">job with a reward</text>

<rect x="262" y="104" width="170" height="76" rx="8" fill="#fdf9ef" stroke="#d8c48a" stroke-width="1.5"/>
<text x="347" y="132" class="h" text-anchor="middle">Compute worker</text><text x="347" y="153" class="s" text-anchor="middle">executes, returns a</text><text x="347" y="170" class="s" text-anchor="middle">result — a claim</text>

<rect x="484" y="104" width="200" height="76" rx="8" fill="#f2f7fc" stroke="#7fa3c9" stroke-width="1.5"/>
<text x="584" y="132" class="h" text-anchor="middle">Independent validators</text><text x="584" y="153" class="s" text-anchor="middle">re-check the result,</text><text x="584" y="170" class="s" text-anchor="middle">no stake in the outcome</text>

<rect x="736" y="104" width="184" height="76" rx="8" fill="#f1f8f3" stroke="#2f7d4f" stroke-width="1.5"/>
<text x="828" y="132" class="h" text-anchor="middle" fill="#1f5c39">Settlement record</text><text x="828" y="153" class="s" text-anchor="middle">written only on</text><text x="828" y="170" class="s" text-anchor="middle">panel agreement</text>

<line x1="210" y1="142" x2="254" y2="142" stroke="#5b6b7f" stroke-width="2" marker-end="url(#a)"/>
<line x1="432" y1="142" x2="476" y2="142" stroke="#5b6b7f" stroke-width="2" marker-end="url(#a)"/>
<line x1="684" y1="142" x2="728" y2="142" stroke="#2f7d4f" stroke-width="2" marker-end="url(#a)"/>

<path d="M584 180 L584 236" stroke="#a4442f" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<rect x="440" y="244" width="288" height="56" rx="8" fill="#fdf3f0" stroke="#a4442f" stroke-width="1.5"/>
<text x="584" y="270" class="h" text-anchor="middle" fill="#87351f">No agreement, no settlement</text>
<text x="584" y="290" class="s" text-anchor="middle">the reward is not released</text>

<rect x="40" y="244" width="360" height="56" rx="8" fill="#fdf9ef" stroke="#d8c48a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="220" y="278" class="s" text-anchor="middle" font-style="italic">a returned result is a claim, not a settled fact</text>

<rect x="40" y="330" width="880" height="62" rx="8" class="b"/>
<text x="62" y="355" class="l">WHY THIS IS HARD</text>
<text x="62" y="377" class="s">Confirming that off-chain computation was actually performed correctly is the difficult part. Re-checking costs redundant compute and adds latency; that cost is the price of not trusting the worker.</text>

<text x="40" y="424" class="cap">Architecture as designed and implemented. No third-party audit has been performed. No adoption, volume,</text>
<text x="40" y="442" class="cap">market status, or sustained throughput is claimed.</text>
</svg>
